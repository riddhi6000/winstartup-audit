<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Startup Audit</title>
  <meta name="winaudit-token" content="__WINAUDIT_TOKEN__">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: clamp(0.75rem, 1.5vw, 1.5rem);
      max-width: 100%;
      overflow-x: hidden;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    #summary {
      color: #9a9a9a;
      margin-bottom: 1rem;
      line-height: 1.45;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    #scanBtn {
      background: #0e7490;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0;
    }
    #scanBtn:disabled, #saveBaselineBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #saveBaselineBtn {
      background: #374151;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0;
      margin-left: 0;
    }
    #baselineInfo {
      color: #9a9a9a;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    #coverage {
      color: #b0b0b0;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    #coverage ul { margin: 0.25rem 0 0 1.1rem; padding: 0; }
    .coverage-warning { color: #fbbf24; }
    .coverage-failed { color: #f87171; }
    .diff-new { background: rgba(248, 113, 113, 0.08); }
    .diff-modified { background: rgba(251, 191, 36, 0.08); }
    .diff-badge-modified {
      display: inline-block;
      background: #fbbf24;
      color: #1e1e1e;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.4rem;
    }
    .verify-note { color: #888; font-size: 0.7rem; font-weight: normal; }
    #removedSection {
      margin-top: 1.5rem;
      display: none;
    }
    #removedSection h2 {
      font-size: 1.1rem;
      color: #f87171;
    }
    #removedSection ul {
      font-size: 0.85rem;
      color: #c0c0c0;
    }
    .diff-badge {
      display: inline-block;
      background: #f87171;
      color: #1e1e1e;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.4rem;
    }
    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-top: 1px solid #333;
      scrollbar-width: thin;
      scrollbar-color: #555 #1e1e1e;
    }
    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    #resultsTable th:nth-child(1), #resultsTable td:nth-child(1) { width: 4%; }
    #resultsTable th:nth-child(2), #resultsTable td:nth-child(2) { width: 9%; }
    #resultsTable th:nth-child(3), #resultsTable td:nth-child(3) { width: 10%; }
    #resultsTable th:nth-child(4), #resultsTable td:nth-child(4) { width: 17%; }
    #resultsTable th:nth-child(5), #resultsTable td:nth-child(5) { width: 24%; }
    #resultsTable th:nth-child(6), #resultsTable td:nth-child(6) { width: 27%; }
    #resultsTable th:nth-child(7), #resultsTable td:nth-child(7) { width: 9%; }
    th, td {
      text-align: left;
      padding: 0.55rem 0.5rem;
      border-bottom: 1px solid #333;
      vertical-align: top;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    th {
      color: #9a9a9a;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }
    .score-cell {
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
    }
    .score-0 { color: #4ade80; }
    .score-low { color: #fbbf24; }
    .score-high { color: #f87171; }
    .command {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.72rem;
      color: #b0b0b0;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    .reasons {
      font-size: 0.75rem;
      color: #c0c0c0;
      overflow-wrap: anywhere;
    }
    #resultsTable tbody tr:hover { filter: brightness(1.12); }
    #removedSection { max-width: 100%; overflow-wrap: anywhere; }
    #removedList li { margin-bottom: 0.35rem; overflow-wrap: anywhere; }
    @media (max-width: 1000px) {
      body { padding: 0.75rem; }
      table { font-size: 0.72rem; }
      th, td { padding: 0.45rem 0.35rem; }
      #resultsTable th:nth-child(3), #resultsTable td:nth-child(3) { width: 11%; }
      #resultsTable th:nth-child(4), #resultsTable td:nth-child(4) { width: 16%; }
      #resultsTable th:nth-child(5), #resultsTable td:nth-child(5) { width: 23%; }
      #resultsTable th:nth-child(6), #resultsTable td:nth-child(6) { width: 29%; }
      #resultsTable th:nth-child(7), #resultsTable td:nth-child(7) { width: 10%; }
    }
    @media (max-width: 650px) {
      h1 { font-size: 1.25rem; }
      .button-row { align-items: stretch; }
      #scanBtn, #saveBaselineBtn { width: 100%; }
      #resultsTable { min-width: 760px; }
      .table-wrap { border-bottom: 1px solid #333; }
    }
  </style>
</head>
<body>
  <h1>Windows Startup Audit</h1>
  <div id="summary">Click "Run Scan" to audit this machine's autostart locations.</div>
  <div class="button-row">
    <button id="scanBtn">Run Scan</button>
    <button id="saveBaselineBtn">Save Current State as Baseline</button>
  </div>
  <div id="baselineInfo"></div>
  <div id="coverage"></div>
  <div id="removedSection">
    <h2>Removed since baseline</h2>
    <ul id="removedList"></ul>
  </div>
  <div class="table-wrap">
  <table id="resultsTable" style="display:none">
    <thead>
      <tr>
        <th title="Not a probability of malware. A higher number means more reasons to take a closer look.">Review score</th>
        <th></th>
        <th>Source</th>
        <th>Name</th>
        <th>Command / Path</th>
        <th>Reasons</th>
        <th>VirusTotal</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
  </div>

  <script nonce="__CSP_NONCE__">
    const btn = document.getElementById('scanBtn');
    const summary = document.getElementById('summary');
    const table = document.getElementById('resultsTable');
    const tbody = document.getElementById('resultsBody');
    const saveBaselineBtn = document.getElementById('saveBaselineBtn');
    const baselineInfo = document.getElementById('baselineInfo');
    const removedSection = document.getElementById('removedSection');
    const removedList = document.getElementById('removedList');
    const coverageBox = document.getElementById('coverage');
    const apiToken = document.querySelector('meta[name="winaudit-token"]').content;

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), 'X-WinAudit-Token': apiToken },
      });
      if (!response.ok) {
        let detail = `Server returned ${response.status}`;
        try {
          const body = await response.json();
          if (typeof body.detail === 'string') detail = body.detail;
        } catch (_) { /* the body was not JSON; keep the generic message */ }
        if (response.status === 403) {
          detail = 'Session expired or rejected — reload this page and try again';
        }
        throw new Error(detail);
      }
      return response.json();
    }

    function renderCoverage(coverage, skippedSources) {
      const e = coverage.entries;
      const lines = [
        `<div>Verification: ${e.verification.complete} fully verified, ` +
          `${e.verification.partial} partly verified (inconclusive signature, or run through ` +
          `a host program such as svchost or rundll32), ${e.verification.none} not verified.</div>`,
        `<div>Executables: ${e.executable.found} found, ` +
          `${e.executable.unexpanded} with unexpanded variables, ` +
          `${e.executable.missing} not found, ${e.executable.no_path} without a path.</div>`,
        `<div>Signatures: ${e.signature.checked} of ${e.total} entries had a conclusive result ` +
          `(${e.signature.inconclusive} inconclusive, ${e.signature.skipped} skipped).</div>`,
        `<div>VirusTotal: ${e.virustotal.checked} checked, ` +
          `${e.virustotal.stale} from an older check, ` +
          `${e.virustotal.deferred} queued for the next scan, ` +
          `${e.virustotal.error} failed, ${e.virustotal.not_queried} not selected for lookup.</div>`,
      ];

      const problems = coverage.scanners.filter(s => s.status !== 'complete');
      if (problems.length > 0) {
        lines.push('<ul>' + problems.map(s =>
          `<li class="${s.status === 'failed' ? 'coverage-failed' : 'coverage-warning'}">` +
          `<strong>${escapeHtml(s.scanner)}</strong> ${escapeHtml(s.status)}: ` +
          `${escapeHtml(s.errors.join('; '))}</li>`
        ).join('') + '</ul>');
      }
      if (skippedSources.length > 0) {
        lines.push(
          `<div class="coverage-warning">Baseline comparison skipped for: ` +
          `${escapeHtml(skippedSources.join(', '))}</div>`
        );
      }
      coverageBox.innerHTML = lines.join('');
    }

    function scoreClass(score) {
      if (score === 0) return 'score-0';
      if (score <= 2) return 'score-low';
      return 'score-high';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function startNote(entry) {
      const extra = entry.extra || {};
      if (!extra.start_mode) return '';
      const parts = [`start type: ${extra.start_mode.toLowerCase()}`];
      if (extra.state) parts.push(extra.state.toLowerCase());
      return parts.join(' · ');
    }

    function verificationNote(level) {
      if (level === 'none') return 'not verified';
      if (level === 'partial') return 'partly verified';
      return '';
    }

    function formatVirusTotal(vt) {
      if (!vt) return '<span style="color:#666">—</span>';
      if (vt.deferred) return '<span style="color:#888">queued for the next scan</span>';
      if (vt.error) return `<span style="color:#888" title="${escapeHtml(vt.error)}">check failed</span>`;
      if (!vt.found) return '<span style="color:#888" title="Not a safety verdict: VirusTotal has no record of this exact file">never seen by VirusTotal</span>';
      const color = vt.malicious_count === 0 ? '#4ade80'
        : vt.malicious_count / vt.total_engines >= 0.3 ? '#f87171'
        : '#fbbf24';
      const age = vt.stale ? ' (older result)' : '';
      return `<span style="color:${color}">${vt.malicious_count}/${vt.total_engines} flagged${age}</span>`;    }

    async function runScan() {
      btn.disabled = true;
      btn.textContent = 'Scanning... (this can take up to a minute)';
      summary.textContent = '';
      coverageBox.innerHTML = '';
      table.style.display = 'none';
      tbody.innerHTML = '';

      try {
        const data = await apiFetch('/api/scan');

        summary.textContent =
          `${data.total_entries} autostart entries found — ${data.flagged_count} flagged for review.`;
        renderCoverage(data.coverage, data.diff_skipped_sources || []);
        if (data.baseline_saved_at) {
          const savedDate = new Date(data.baseline_saved_at).toLocaleString();
          const d = data.diff;
          baselineInfo.textContent =
            `Compared against baseline saved ${savedDate}: ` +
            `${d.new.length} new, ${d.removed.length} removed, ${d.modified.length} modified, ` +
            `${d.unchanged_count} unchanged.`;
          if (d.removed.length > 0) {
            removedList.innerHTML = d.removed
              .map(e => `<li>${escapeHtml(e.source)}: ${escapeHtml(e.name)} — <span class="command">${escapeHtml(e.command)}</span></li>`)
              .join('');
            removedSection.style.display = 'block';
          } else {
            removedSection.style.display = 'none';
          }
        } else if (data.baseline_error) {
          baselineInfo.textContent = `Baseline could not be used: ${data.baseline_error}`;
        } else {
          baselineInfo.textContent = 'No baseline saved yet — click "Save Current State as Baseline" to start tracking changes over time.';
        }

        const newKeys = new Set(
          (data.diff?.new || []).map(e => `${e.source}|${e.name}|${e.location}`)
        );
        const modifiedMap = new Map(
          (data.diff?.modified || []).map(m =>
            [`${m.entry.source}|${m.entry.name}|${m.entry.location}`, m.previous_command]
          )
        );
        for (const entry of data.entries) {
          const row = document.createElement('tr');
          const entryKey = `${entry.source}|${entry.name}|${entry.location}`;
          const isNew = newKeys.has(entryKey);
          const previousCommand = modifiedMap.get(entryKey);
          if (isNew) row.className = 'diff-new';
          else if (previousCommand !== undefined) row.className = 'diff-modified';
          row.innerHTML = `
            <td class="score-cell ${scoreClass(entry.score)}">${entry.score}<div class="verify-note">${verificationNote(entry.checks.verification)}</div></td>
            <td>
                ${isNew ? '<span class="diff-badge">NEW</span>' : ''}
                ${previousCommand !== undefined ? '<span class="diff-badge-modified">CHANGED</span>' : ''}
            </td>
            <td>${escapeHtml(entry.source)}</td>
            <td>${escapeHtml(entry.name)}<div class="verify-note">${escapeHtml(startNote(entry))}</div></td>
            <td class="command">
                ${escapeHtml(entry.command)}
                ${previousCommand !== undefined ? `<br><span style="color:#888">was: ${escapeHtml(previousCommand)}</span>` : ''}
            </td>
            <td class="reasons">${escapeHtml(entry.reasons.join('; '))}</td>
            <td>${formatVirusTotal(entry.virustotal)}</td>
          `;
          tbody.appendChild(row);
        }

        table.style.display = '';
      } catch (err) {
        summary.textContent = `Scan failed: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Scan';
      }
    }

    btn.addEventListener('click', runScan);

    saveBaselineBtn.addEventListener('click', async () => {
      saveBaselineBtn.disabled = true;
      saveBaselineBtn.textContent = 'Saving...';
      try {
        const data = await apiFetch('/api/baseline/save', { method: 'POST' });
        const note = data.incomplete_scanners.length > 0
          ? ` Incomplete scanners: ${data.incomplete_scanners.join(', ')}.`
          : '';
        baselineInfo.textContent = `Baseline saved — ${data.entry_count} entries recorded.${note}`;      } catch (err) {
        baselineInfo.textContent = `Failed to save baseline: ${err.message}`;
      } finally {
        saveBaselineBtn.disabled = false;
        saveBaselineBtn.textContent = 'Save Current State as Baseline';
      }
    });
  </script>
</body>
</html>
