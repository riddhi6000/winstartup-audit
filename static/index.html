<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Startup Audit</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    #summary {
      color: #9a9a9a;
      margin-bottom: 1.5rem;
    }
    #scanBtn {
      background: #0e7490;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }
    #scanBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #333;
      vertical-align: top;
    }
    th {
      color: #9a9a9a;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    .score-cell {
      font-weight: bold;
      text-align: center;
      width: 3rem;
    }
    .score-0 { color: #4ade80; }
    .score-low { color: #fbbf24; }
    .score-high { color: #f87171; }
    .command {
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      color: #b0b0b0;
      word-break: break-all;
    }
    .reasons {
      font-size: 0.8rem;
      color: #c0c0c0;
    }
  </style>
</head>
<body>
  <h1>Windows Startup Audit</h1>
  <div id="summary">Click "Run Scan" to audit this machine's autostart locations.</div>
  <button id="scanBtn">Run Scan</button>
  <table id="resultsTable" style="display:none">
    <thead>
      <tr>
        <th>Risk</th>
        <th>Source</th>
        <th>Name</th>
        <th>Command / Path</th>
        <th>Reasons</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script>
    const btn = document.getElementById('scanBtn');
    const summary = document.getElementById('summary');
    const table = document.getElementById('resultsTable');
    const tbody = document.getElementById('resultsBody');

    function scoreClass(score) {
      if (score === 0) return 'score-0';
      if (score <= 2) return 'score-low';
      return 'score-high';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function runScan() {
      btn.disabled = true;
      btn.textContent = 'Scanning... (this can take up to a minute)';
      summary.textContent = '';
      table.style.display = 'none';
      tbody.innerHTML = '';

      try {
        const response = await fetch('/api/scan');
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const data = await response.json();

        summary.textContent =
          `${data.total_entries} autostart entries found — ${data.flagged_count} flagged for review.`;

        for (const entry of data.entries) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="score-cell ${scoreClass(entry.score)}">${entry.score}</td>
            <td>${escapeHtml(entry.source)}</td>
            <td>${escapeHtml(entry.name)}</td>
            <td class="command">${escapeHtml(entry.command)}</td>
            <td class="reasons">${escapeHtml(entry.reasons.join('; '))}</td>
          `;
          tbody.appendChild(row);
        }

        table.style.display = '';
      } catch (err) {
        summary.textContent = `Scan failed: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Scan';
      }
    }

    btn.addEventListener('click', runScan);
  </script>
</body>
</html>
